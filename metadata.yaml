name: astrbot_plugin_bio_status
display_name: 体征档案
short_desc: 给 AI 角色加一套会波动的体征数值，支持可视化页面
desc: |
  给 AI 角色加一套体征状态：欲望值、温度、残留量、插拔状态。

  ## 功能
  - 每轮对话根据关键词自动推进状态
  - 时间推进：残留自动吸收、档位自动回落
  - 完整可视化页面：状态图、事件日志、参数设置
  - 所有数值、词表、档位名都可在插件配置里改

  ## 使用
  插件会在每轮对话前注入一段读数，让角色知道当前状态。
  也可以用 /体征 命令查看，/体征归零 重置。
